name: Hiltronix Android ARM64 test APK

# Only validate the latest source revision while hardening the security branch.
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      sign_release:
        description: 'Sign a permanent Hiltronix APK with the repository keystore secrets'
        type: boolean
        required: true
        default: false
  push:
    branches: [main, 'security/android-logging-crypto-2026-10-28']
    paths:
      - '.github/workflows/hiltronix-android-test.yml'
      - 'scripts/build-android-foss.sh'
      - 'android/**'
      - 'db-service-ffi/**'
      - 'uniffi-bindgen/**'
      - 'src-cljs/**'
      - 'foss-stubs/**'
      - 'metro.config.js'
      - 'react-native.config.js'
      - 'package.json'
      - 'yarn.lock'

permissions:
  contents: read

jobs:
  android-test-apk:
    name: Build installable Android test APK
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      OKP_FOSS_BUILD: '1'
      OKP_TEST_BUILD: '1'
      # The push exception below is intentionally single-use: only the push
      # directly following the reviewed commit can use the permanent key.
      # Future pushes return to disposable-test-only signing.
      OKP_RELEASE_BUILD: ${{ github.ref == 'refs/heads/security/android-logging-crypto-2026-10-28' && ((github.event_name == 'workflow_dispatch' && inputs.sign_release == true) || (github.event_name == 'push' && github.event.before == 'c7b84e9a799b69e2bb993eb9201d83cbcd9d3ea6')) && '1' || '0' }}
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out Hiltronix Android source
        uses: actions/checkout@v4

      - name: Validate explicit release or one-time authorized signing trigger
        if: ${{ env.OKP_RELEASE_BUILD == '1' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != 'refs/heads/security/android-logging-crypto-2026-10-28' ]]; then
            echo "::error::Permanent signing is only allowed on the approved Android security branch"
            exit 1
          fi
          echo "OKP_RELEASE_VERSION_CODE=$((1000000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Check permanent signing secrets exist before compiling
        if: ${{ env.OKP_RELEASE_BUILD == '1' }}
        shell: bash
        env:
          KEYSTORE_PRESENT: ${{ secrets.ONEKEYPASS_KEYSTORE_BASE64 != '' }}
          STORE_PASSWORD_PRESENT: ${{ secrets.ONEKEYPASS_KEYSTORE_PASSWORD != '' }}
          KEY_ALIAS_PRESENT: ${{ secrets.ONEKEYPASS_KEY_ALIAS != '' }}
          KEY_PASSWORD_PRESENT: ${{ secrets.ONEKEYPASS_KEY_PASSWORD != '' }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_PRESENT STORE_PASSWORD_PRESENT KEY_ALIAS_PRESENT KEY_PASSWORD_PRESENT; do
            if [[ "${!name}" != 'true' ]]; then
              echo "::error::Required OKP signing secret is missing: $name"
              exit 1
            fi
          done

      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify permanent keystore contains exactly one private signing key
        if: ${{ env.OKP_RELEASE_BUILD == '1' }}
        shell: bash
        env:
          OKP_SIGNING_B64: ${{ secrets.ONEKEYPASS_KEYSTORE_BASE64 }}
          OKP_SIGNING_STORE_PASSWORD: ${{ secrets.ONEKEYPASS_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/okp-signing-preflight.p12"
          inventory="$RUNNER_TEMP/okp-signing-preflight.txt"
          trap 'rm -f "$key_file" "$inventory"' EXIT
          printf '%s' "$OKP_SIGNING_B64" | base64 --decode > "$key_file"
          if ! keytool -list -v \
            -keystore "$key_file" -storetype PKCS12 \
            -storepass:env OKP_SIGNING_STORE_PASSWORD > "$inventory" 2>&1; then
            echo "::error::Unable to read the signing keystore. Check keystore format and password."
            exit 1
          fi
          private_count="$(grep -c '^Entry type: PrivateKeyEntry' "$inventory" || true)"
          if [[ "$private_count" != '1' ]]; then
            echo "::error::Keystore must contain exactly one PrivateKeyEntry, but found $private_count."
            echo "::error::A certificate-only TrustedCertEntry cannot sign an APK."
            exit 1
          fi
          echo 'PASS: exactly one private signing key is present in the keystore'

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      - name: Install Yarn Classic
        run: npm install --global yarn@1.22.22

      - name: Verify camera-free JavaScript dependency lockfile
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'react-native-vision-camera' yarn.lock; then
            echo "::error::Removed native camera package persists in yarn.lock"
            exit 1
          fi
          # The build uses yarn install --frozen-lockfile, so CI must not
          # silently regenerate the reviewed dependency graph.

      - name: Configure Rust
        shell: bash
        run: |
          rustup toolchain install 1.91.0 --profile minimal --target aarch64-linux-android
          rustup default 1.91.0
          rustc --version
          cargo --version

      - name: Test KDBX staged provider replacement and failure paths
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition=2021 --test db-service-ffi/src/db_file_commit.rs \
            -o "$RUNNER_TEMP/kdbx-provider-tests"
          "$RUNNER_TEMP/kdbx-provider-tests"

      - name: Verify untrusted SAF backup filenames cannot escape recovery directory
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition=2021 --test db-service-ffi/src/backup_filename.rs \
            -o "$RUNNER_TEMP/kdbx-backup-path-tests"
          "$RUNNER_TEMP/kdbx-backup-path-tests"
          python3 - <<'PY'
          from pathlib import Path
          backup = Path('db-service-ffi/src/backup.rs').read_text()
          assert 'crate::backup_filename::backup_file_stem(kdbx_file_name)?' in backup
          print('PASS: backup history creation applies validated path-safe stems')
          PY

      - name: Verify KDBX recovery is staged before SAF write access
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          module = Path("android/app/src/main/java/com/onekeepassmobile/DbServiceModule.kt").read_text()
          save = module.split("fun saveKdbx(", 1)[1].split("fun createKdbx(", 1)[0]
          assert 'stageBackupBeforeSave(fullFileNameUri)' in save
          assert 'openFileDescriptor(uri, "rw")' in save
          assert 'openFileDescriptor(uri, "rwt")' not in save
          assert save.index('stageBackupBeforeSave(fullFileNameUri)') < save.index('openFileDescriptor(uri, "rw")')
          assert save.index('val response = fd.use') < save.index('promise.resolve(response.result)')
          rust = Path("db-service-ffi/src/udl_functions.rs").read_text()
          assert 'crate::db_file_commit::copy_staged_kdbx_to_provider' in rust
          assert 'Creating encrypted KDBX backup failed; save aborted' in rust
          assert 'AppState::add_last_backup_name_on_error(&db_key, path)' in rust

          # New database creation must reject partial writes and only
          # acknowledge completion after the provider descriptor closes.
          create = module.split('fun createKdbx(', 1)[1].split('fun completeSaveAsOnError(', 1)[0]
          assert 'val response = fd.use { descriptor ->' in create
          assert create.index('val response = fd.use') < create.rindex('resolveResponse(response, promise)')
          native = Path('db-service-ffi/src/android/support_services.rs').read_text()
          create_native = native.split('pub fn create_kdbx(', 1)[1].split('pub fn save_key_file(', 1)[0]
          assert 'try_clone_to_owned()' in create_native
          assert 'format!("{name}.partial")' in create_native
          assert 'bf_writer.sync_all()?' in create_native
          assert 'fs::rename(temporary, final_path)?' in create_native
          assert 'let copied = std::io::copy(&mut bf_writer, &mut file)?' in create_native
          assert 'if copied != expected_len' in create_native
          assert 'file.sync_all()?' in create_native
          assert 'let _n = std::io::copy' not in create_native
          assert 'let _ = file.sync_all()' not in create_native
          print("PASS: KDBX staged save and checked creation paths")
          PY

      - name: Configure native toolchain prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang cmake ninja-build pkg-config python3 libssl-dev

      - name: Install Rust build helpers
        run: |
          cargo install just --version 1.40.0 --locked
          cargo install --git https://github.com/bbqsrc/cargo-ndk.git --tag v3.5.7 cargo-ndk --locked
          just --version
          cargo ndk --version

      - name: Configure Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Install exact Android SDK and NDK versions
        shell: bash
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "ndk;27.1.12297006"
          test -f "$ANDROID_HOME/ndk/28.2.13676358/source.properties"
          test -f "$ANDROID_HOME/ndk/27.1.12297006/source.properties"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Resolve shared Rust core and security dependency versions
        shell: bash
        run: |
          set -euo pipefail
          manifest=db-service-ffi/Cargo.toml

          # Use only reviewed and committed dependency versions.
          # Any new core or cryptography updates require a separate patch
          # and security review before release or test APK compilation.
          python3 - <<'PY'
          import sys, tomllib
          from pathlib import Path
          with Path("db-service-ffi/Cargo.lock").open("rb") as f:
              packages = tomllib.load(f)["package"]
          versions = {}
          for p in packages:
              versions.setdefault(p["name"], set()).add(p["version"])
          forbidden = {
              ("crypto-bigint", "0.5.5"),
              ("crypto-bigint", "0.7.5"),
              ("quick-xml", "0.37.5"),
              ("ctutils", "0.4.2"),
              ("p256", "0.13.2"),
          }
          required = {
              ("crypto-bigint", "0.7.10"),
              ("quick-xml", "0.41.0"),
              ("p256", "0.14.0-rc.10"),
          }
          present = {(name, version) for name, vs in versions.items() for version in vs}
          old = forbidden & present
          missing = required - present
          for name in ("crypto-bigint", "quick-xml", "ctutils", "p256"):
              print(f"{name}: {', '.join(sorted(versions.get(name, [])))}")
          ctutils_ok = any(
              tuple(int(x) for x in v.split(".")) >= (0, 4, 4)
              for v in versions.get("ctutils", set())
          )
          if old or missing or not ctutils_ok:
              sys.exit(
                  f"SECURITY GATE FAILED: forbidden={sorted(old)} "
                  f"missing={sorted(missing)} ctutils_minimum_met={ctutils_ok}"
              )
          print("PASS: patched shared core and cryptography/XML dependencies")
          PY

      - name: Verify sensitive command and logging exposure was removed
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          checks = {
            "db-service-ffi/src/commands.rs": [
              '"test_call" =>',
              'Invalid command args received {}',
              'Decrypted text is {}',
            ],
            "db-service-ffi/src/android/support_services.rs": [
              '"test_call" =>',
              'Invalid command or args: Command call',
              'Uncrypted string data is',
            ],
            "db-service-ffi/src/remote_storage/secure_store.rs": [
              'Uncrypted string data is',
            ],
            "android/app/src/main/java/com/onekeepassmobile/DbServiceModule.kt": [
              'command name $commandName and args $args',
              'jsonArgs $jsonArgs',
            ],
            "android/app/src/main/java/com/onekeepassmobile/SecureKeyOperationImpl.kt": [
              'Stored dbKey $dbKey with value $encKeyData',
              'Returning key $k',
            ],
            "android/app/src/main/java/com/onekeepassmobile/ApiCallbackServiceImpl.kt": [
              'clipboardCopyString is called with $clipData',
            ],
          }
          for file, secrets in checks.items():
              text = Path(file).read_text()
              for phrase in secrets:
                  if phrase in text:
                      raise SystemExit(f"Sensitive logging or test command still exposed in {file}: {phrase}")
          rust = Path("db-service-ffi/src/udl_functions.rs").read_text()
          if '#[cfg(all(target_os = "android", debug_assertions))]' not in rust:
              raise SystemExit("Production Rust logging restriction missing")
          print("PASS: sensitive logging and test-command static checks")
          PY
          python3 - <<'PY'
          from pathlib import Path
          release = Path("android/app/src/release/AndroidManifest.xml").read_text()
          native = Path("db-service-ffi/src/commands.rs").read_text()
          required = (
              'android.permission.INTERNET',
              'android.permission.ACCESS_NETWORK_STATE',
              'android.permission.CAMERA',
              'tools:node="remove"',
              'android:usesCleartextTraffic="false"',
          )
          for text in required:
              if text not in release:
                  raise SystemExit(f"Missing release manifest protection: {text}")
          if 'command_name.starts_with("rs_")' not in native or 'command_name == "add_custom_icon_from_url"' not in native:
              raise SystemExit("Android network command denylist is missing")
          print("PASS: offline Android release source restrictions")
          PY

      - name: Verify SFTP WebDAV and HTTP client crates are not compiled for Android
        shell: bash
        run: |
          set -euo pipefail
          cargo tree --manifest-path db-service-ffi/Cargo.toml \
            --target aarch64-linux-android --edges normal --prefix none \
            > "$RUNNER_TEMP/android-rust-dependencies.txt"
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path(__import__("os").environ["RUNNER_TEMP"], "android-rust-dependencies.txt").read_text()
          forbidden = ("russh", "russh-sftp", "reqwest_dav", "reqwest", "hyper", "webpki-roots")
          found = [name for name in forbidden if re.search(
              rf"(?m)^{re.escape(name)} v[0-9]", text)]
          if found:
              raise SystemExit("Offline Android still compiles network dependencies: " + ", ".join(found))
          print("PASS: Android compiled dependency tree excludes SSH, WebDAV and HTTP clients")
          PY

      - name: Verify removed remote-storage UI modules are absent
        shell: bash
        run: |
          set -euo pipefail
          root=src-cljs/cljs-main-app-src/main/onekeepass/mobile
          for module in background_remote_server.cljs events/remote_storage.cljs \
                        events/external_db_change.cljs external_db_change.cljs \
                        remote_connection_unavailable.cljs rs_config_form.cljs \
                        rs_configs.cljs rs_files_folders.cljs; do
            if test -e "$root/$module"; then
              echo "::error::Remote-storage UI module remains: $module"
              exit 1
            fi
          done
          echo "PASS: removed SFTP/WebDAV UI modules are absent"

      - name: Assert in-app camera code is removed and external OTP import remains
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          pkg = json.loads(Path("package.json").read_text())
          assert "react-native-vision-camera" not in pkg["dependencies"]
          base = Path("src-cljs/cljs-main-app-src/main/onekeepass/mobile")
          for p in ("scan_otp_qr.cljs", "events/scan_otp_qr.cljs"):
              assert not (base / p).exists(), p
          for p in ("background.cljs", "background_common.cljs", "rn_components.cljs", "appbar.cljs"):
              text = (base / p).read_text()
              for token in ("react-native-vision-camera", "scan-otp-qr", "CAMERA_SCANNER_PAGE_ID"):
                  assert token not in text, (p, token)
          manifest = Path("android/app/src/main/AndroidManifest.xml").read_text()
          assert "android.permission.CAMERA" not in manifest
          assert 'android:scheme="otpauth"' in manifest
          assert 'android:host="totp"' in manifest
          assert "otp-auth-url-on-create" in (base / "background.cljs").read_text()
          assert "otp-url-received" in (base / "core.cljs").read_text()
          assert not Path("foss-stubs/react-native-vision-camera.js").exists()
          print("PASS: no camera library or scanner UI; external otpauth:// TOTP entry retained")
          PY

      - name: Verify internal authentication entry points are private
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET

          namespace = '{http://schemas.android.com/apk/res/android}'
          root = ET.parse('android/app/src/main/AndroidManifest.xml').getroot()
          application = root.find('application')
          assert application is not None
          assert application.get(namespace + 'allowBackup') == 'false'

          activities = {a.get(namespace + 'name'): a for a in application.findall('activity')}
          autofill = activities['.autofill.AutofillAuthenticationActivity']
          assert autofill.get(namespace + 'exported') == 'false'
          assert autofill.findall('intent-filter') == []
          assert activities['.passkey.PasskeyActivity'].get(namespace + 'exported') == 'false'

          services = {s.get(namespace + 'name'): s for s in application.findall('service')}
          assert services['.autofill.AuthenticatedAutofillService'].get(namespace + 'permission') == 'android.permission.BIND_AUTOFILL_SERVICE'
          assert services['.passkey.PasskeyProviderService'].get(namespace + 'permission') == 'android.permission.BIND_CREDENTIAL_PROVIDER_SERVICE'
          provider = application.find('provider')
          assert provider is not None and provider.get(namespace + 'exported') == 'false'

          source = Path('android/app/src/main/java/com/onekeepassmobile')
          builder = (source / 'autofill/OkpFillResponseBuilder.kt').read_text()
          assert 'Intent(packageContext, AutofillAuthenticationActivity::class.java)' in builder
          assert 'PendingIntent.FLAG_IMMUTABLE' in builder
          assert 'Intent("com.onekeepass.action.AF_LOGIN")' not in builder

          passkey = (source / 'passkey/PasskeyRequestStore.kt').read_text()
          assert passkey.count('Log.e(TAG, "storeAssertionContext parse error")') == 1
          assert passkey.count('Log.e(TAG, "storeRegistrationContext parse error")') == 1
          assert 'clear()\n            Log.e(TAG, "storeAssertionContext parse error")' in passkey
          assert 'clear()\n            Log.e(TAG, "storeRegistrationContext parse error")' in passkey
          passkey_module = (source / 'passkey/PasskeyModule.kt').read_text()
          assert 'JSONObject().put("error", error ?: JSONObject.NULL)' in passkey_module

          biometric = (source / 'BiometricService.kt').read_text()
          failure = biometric.split('override fun onAuthenticationFailed()', 1)[1].split('})', 1)[0]
          assert 'promise.resolve(' not in failure
          print('PASS: private authentication activity, explicit Autofill PendingIntent and fail-closed passkey state')
          PY

      - name: Compile unsigned Android release APK
        shell: bash
        run: bash scripts/build-android-foss.sh

      - name: Verify packaged Rust/Botan library links to Android C++ runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import tempfile
          from zipfile import ZipFile

          apk = Path('android/app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk')
          assert apk.is_file() and apk.stat().st_size > 0
          with tempfile.TemporaryDirectory() as tmp, ZipFile(apk) as package:
              required = ('libdb_service_ffi.so', 'libc++_shared.so')
              libs = {}
              for name in required:
                  member = 'lib/arm64-v8a/' + name
                  if member not in package.namelist():
                      raise SystemExit(f'Native startup blocker: {member} absent from APK')
                  dest = Path(tmp, name)
                  dest.write_bytes(package.read(member))
                  libs[name] = dest

              def readelf(*arguments):
                  return subprocess.check_output(
                      ['readelf', '-W', *arguments], text=True
                  )

              db = libs['libdb_service_ffi.so']
              cxx = libs['libc++_shared.so']
              needed = readelf('-d', str(db))
              if 'Shared library: [libc++_shared.so]' not in needed:
                  raise SystemExit(
                      'Native startup blocker: Rust/Botan .so does not declare '
                      'DT_NEEDED libc++_shared.so'
                  )

              # Crash observed on Android 16: unresolved std::__ndk1::string
              # destructor on JNA Native.load(db_service_ffi).
              symbol = (
                  '_ZNSt6__ndk112basic_stringIcNS_11char_traitsIcEENS_'
                  '9allocatorIcEEED2Ev'
              )
              exports = readelf('--dyn-syms', str(cxx))
              matches = [
                  line for line in exports.splitlines()
                  if line.split() and line.split()[-1] == symbol
              ]
              if not any(' UND ' not in line for line in matches):
                  raise SystemExit(
                      'Native startup blocker: packaged libc++ does not export '
                      'the exact C++ symbol required by Botan'
                  )
              print('PASS: Rust/Botan DT_NEEDED links to packaged libc++_shared.so')
              print('PASS: packaged C++ runtime exports the previously missing symbol')
          PY

      - name: Verify all builds use committed dependency locks
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- db-service-ffi/Cargo.lock yarn.lock; then
            echo "::error::Release dependency locks changed during build. Commit and review them first."
            exit 1
          fi

      - name: Sign temporary test APK, verify and record hashes
        shell: bash
        run: |
          set -euo pipefail
          unsigned="android/app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk"
          test -s "$unsigned"
          mkdir -p dist

          # This key is temporary, exists only on this Actions runner, and is
          # NOT suitable for real secrets or repeatable Android app upgrades.
          keytool -genkeypair -noprompt \
            -storetype PKCS12 \
            -keystore "$RUNNER_TEMP/hiltronix-test-only.p12" \
            -storepass 'temporary-ci-test-only' \
            -keypass 'temporary-ci-test-only' \
            -alias hiltronix-test \
            -keyalg RSA -keysize 3072 -validity 30 \
            -dname 'CN=Hiltronix Disposable Test Key'
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -p -f 4 \
            "$unsigned" "$RUNNER_TEMP/hiltronix-aligned.apk"
          apk="dist/OneKeePass-Hiltronix-Android-arm64-TEST.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/hiltronix-test-only.p12" \
            --ks-type PKCS12 \
            --ks-key-alias hiltronix-test \
            --ks-pass pass:temporary-ci-test-only \
            --out "$apk" "$RUNNER_TEMP/hiltronix-aligned.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --verbose --print-certs "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" \
            | grep -E "^package: name='com.onekeepassmobile.hiltronix'"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$apk" \
            > dist/APK-PERMISSIONS.txt
          sha256sum "$apk" > dist/SHA256SUMS.txt
          cat dist/APK-PERMISSIONS.txt
          cat dist/SHA256SUMS.txt

      - name: Verify release APK is offline and does not request camera access
        shell: bash
        run: |
          set -euo pipefail
          permissions=dist/APK-PERMISSIONS.txt
          test -s "$permissions"
          for permission in INTERNET ACCESS_NETWORK_STATE CAMERA; do
            if grep -Eq "name='android\\.permission\\.$permission'" "$permissions"; then
              echo "::error::Forbidden Android release permission: $permission"
              exit 1
            fi
          done
          # Keep essential biometric and credential-manager functionality.
          grep -Eq "name='android\\.permission\\.USE_BIOMETRIC'" "$permissions"

          apk="dist/OneKeePass-Hiltronix-Android-arm64-TEST.apk"
          badging="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk")"
          if grep -Eq "^uses-feature[^:]*: name='android\\.hardware\\.camera" <<< "$badging"; then
            echo "::error::Camera hardware feature persists in release APK"
            exit 1
          fi

          python3 - "$apk" <<'PY'
          import sys
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as apk:
              files = apk.namelist()
              camera_files = [name for name in files
                              if 'visioncamera' in name.lower() or 'vision-camera' in name.lower()]
              if camera_files:
                  raise SystemExit(f"Camera implementation remains in APK: {camera_files}")
              for name in files:
                  if name.startswith("classes") and name.endswith(".dex"):
                      dex = apk.read(name)
                      if (b"com/mrousavy/camera" in dex or b"com.mrousavy.camera" in dex
                              or b"Lcom/mrousavy/camera" in dex):
                          raise SystemExit(f"Vision Camera classes remain in {name}")
          print("PASS: final APK does not contain Vision Camera package or DEX classes")
          PY
          echo "PASS: no internet, network state, or camera permission/feature in release APK"

      - name: Sign verified production APK with permanent Hiltronix key
        if: ${{ env.OKP_RELEASE_BUILD == '1' }}
        shell: bash
        env:
          OKP_SIGNING_B64: ${{ secrets.ONEKEYPASS_KEYSTORE_BASE64 }}
          OKP_SIGNING_STORE_PASSWORD: ${{ secrets.ONEKEYPASS_KEYSTORE_PASSWORD }}
          OKP_SIGNING_KEY_ALIAS: ${{ secrets.ONEKEYPASS_KEY_ALIAS }}
          OKP_SIGNING_KEY_PASSWORD: ${{ secrets.ONEKEYPASS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077

          for variable in OKP_SIGNING_B64 OKP_SIGNING_STORE_PASSWORD OKP_SIGNING_KEY_ALIAS OKP_SIGNING_KEY_PASSWORD; do
            if [[ -z "${!variable:-}" ]]; then
              echo "::error::Missing Android signing secret: $variable"
              exit 1
            fi
          done

          key_file="$RUNNER_TEMP/okp-hiltronix-signing.p12"
          aligned_apk="$RUNNER_TEMP/okp-hiltronix-release-aligned.apk"
          trap 'rm -f "$key_file" "$aligned_apk"' EXIT

          printf '%s' "$OKP_SIGNING_B64" | base64 --decode > "$key_file"
          unsigned="android/app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk"
          test -s "$unsigned"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -p -f 4 "$unsigned" "$aligned_apk"

          signed_apk="dist/OneKeePass-Hiltronix-Android-arm64-RELEASE.apk"
          # Use the configured alias only when it holds the actual private key.
          # Otherwise apksigner safely selects the sole private-key entry.
          alias_report="$RUNNER_TEMP/okp-signer-alias.txt"
          trap 'rm -f "$key_file" "$aligned_apk" "$alias_report"' EXIT
          alias_args=()
          if keytool -list -v \
            -keystore "$key_file" -storetype PKCS12 \
            -storepass:env OKP_SIGNING_STORE_PASSWORD \
            -alias "$OKP_SIGNING_KEY_ALIAS" > "$alias_report" 2>&1 \
            && grep -q '^Entry type: PrivateKeyEntry' "$alias_report"; then
            alias_args=(--ks-key-alias "$OKP_SIGNING_KEY_ALIAS")
          else
            echo '::notice::Configured alias is not a private key; selecting the single private-key entry automatically.'
          fi

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$key_file" \
            --ks-type PKCS12 \
            "${alias_args[@]}" \
            --ks-pass env:OKP_SIGNING_STORE_PASSWORD \
            --key-pass env:OKP_SIGNING_KEY_PASSWORD \
            --out "$signed_apk" "$aligned_apk"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --verbose --print-certs "$signed_apk" > dist/RELEASE-SIGNATURE.txt
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -p 4 "$signed_apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$signed_apk" \
            > dist/RELEASE-BADGING.txt
          grep -q "^package: name='com.onekeepassmobile.hiltronix' versionCode='$OKP_RELEASE_VERSION_CODE'" \
            dist/RELEASE-BADGING.txt

          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$signed_apk" \
            > dist/RELEASE-PERMISSIONS.txt
          cmp -s dist/APK-PERMISSIONS.txt dist/RELEASE-PERMISSIONS.txt || {
            echo "::error::Signed APK permissions differ from reviewed test APK"
            exit 1
          }
          sha256sum "$signed_apk" > dist/RELEASE-SHA256SUMS.txt
          printf 'Source commit: %s\nBuild number: %s\nPackage: %s\nVersion code: %s\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" 'com.onekeepassmobile.hiltronix' \
            "$OKP_RELEASE_VERSION_CODE" > dist/RELEASE-BUILD-INFO.txt
          echo 'PASS: permanent signature verified; signed APK package and permissions validated'
          cat dist/RELEASE-SHA256SUMS.txt

      - name: Upload manually signed Hiltronix release APK
        if: ${{ env.OKP_RELEASE_BUILD == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: Hiltronix-Android-arm64-SIGNED-${{ github.run_number }}
          path: |
            dist/OneKeePass-Hiltronix-Android-arm64-RELEASE.apk
            dist/RELEASE-SIGNATURE.txt
            dist/RELEASE-BADGING.txt
            dist/RELEASE-PERMISSIONS.txt
            dist/RELEASE-SHA256SUMS.txt
            dist/RELEASE-BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android test APK
        if: ${{ env.OKP_RELEASE_BUILD != '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: Hiltronix-Android-arm64-TEST-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

