name: Hiltronix transitive dependency fix validation

on:
  workflow_dispatch:
  push:
    branches: ['security/android-dependency-hardening-2026-10-29']
    paths:
      - package.json
      - yarn.lock
      - '.github/workflows/hiltronix-dependency-fix-validation.yml'

permissions:
  contents: write

jobs:
  resolve-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out isolated security audit branch
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Yarn Classic
        run: npm install --global yarn@1.22.22

      - name: Resolve, install and test patched dependencies
        shell: bash
        run: |
          set -euo pipefail
          yarn install --non-interactive
          node <<'JS'
          const assert = require('assert');
          const expected = {
              '@babel/plugin-transform-modules-systemjs': '7.29.4',
              '@xmldom/xmldom': '0.8.15',
              'browserslist': '4.28.7',
              'launch-editor': '2.14.2',
              'nanoid': '3.3.20',
              'shell-quote': '1.12.0'
          };
          for (const [name, version] of Object.entries(expected)) {
              assert.strictEqual(require(name + '/package.json').version, version, name);
          }
          const { DOMParser } = require('@xmldom/xmldom');
          const doc = new DOMParser().parseFromString('<root><name>test</name></root>', 'text/xml');
          assert.strictEqual(doc.getElementsByTagName('name')[0].textContent, 'test');
          const browserslist = require('browserslist');
          assert.ok(browserslist('last 1 Chrome version').length >= 1);
          const quote = require('shell-quote');
          assert.strictEqual(quote.parse('echo testing').join(' '), 'echo testing');
          const { nanoid } = require('nanoid');
          assert.strictEqual(nanoid().length, 21);
          const babel = require('@babel/core');
          const result = babel.transformSync('export const answer = 42;', {
              configFile: false,
              babelrc: false,
              plugins: ['@babel/plugin-transform-modules-systemjs']
          });
          assert.ok(result.code.includes('System.register'));
          console.log('PASS: patched toolchain modules load and pass compatibility smoke tests');
          JS

          python3 <<'PY'
          import json
          from pathlib import Path

          expected = {
              '@babel/plugin-transform-modules-systemjs': '7.29.4',
              '@xmldom/xmldom': '0.8.15',
              'browserslist': '4.28.7',
              'launch-editor': '2.14.2',
              'nanoid': '3.3.20',
              'shell-quote': '1.12.0'
          }
          data = json.loads(Path('package.json').read_text())
          assert data['resolutions'].items() >= expected.items()
          lines = Path('yarn.lock').read_text().splitlines()
          for name, version in expected.items():
              positions = [
                  index for index, line in enumerate(lines)
                  if line.startswith(name + '@') or line.startswith('"' + name + '@')
              ]
              if len(positions) != 1:
                  raise SystemExit(f'{name}: expected one lock entry, found {len(positions)}')
              if f'  version "{version}"' not in lines[positions[0]:positions[0] + 5]:
                  raise SystemExit(f'{name}: wrong locked version, expected {version}')
          print('PASS: six dependency resolutions match the lockfile')
          PY

          git diff --check
          yarn install --frozen-lockfile --non-interactive

      - name: Commit updated lockfile only on isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add yarn.lock
          if ! git diff --cached --quiet; then
              git commit -m 'Lock patched transitive dependencies after compatibility checks'
              git push origin HEAD:security/android-dependency-hardening-2026-10-29
          fi
