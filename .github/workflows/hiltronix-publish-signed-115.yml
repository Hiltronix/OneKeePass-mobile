name: Publish verified Hiltronix Android 0.24.0 signed APK

# This one-off workflow publishes an already built and verified Android APK.
# It does not rebuild the binary, re-sign anything, or read the keystore.
on:
  push:
    branches:
      - security/android-logging-crypto-2026-10-28
    paths:
      - .github/workflows/hiltronix-publish-signed-115.yml

permissions:
  contents: write
  actions: read

jobs:
  publish-reviewed-apk:
    # Exact preceding commit makes this trigger single-use; a re-run is blocked
    # if the source branch later moves or a different commit adds this file.
    if: ${{ github.repository == 'Hiltronix/OneKeePass-mobile' && github.event.before == '827c1af704ffa60f5ce35fc268599363364287ae' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: Hiltronix/OneKeePass-mobile
      BUILD_RUN: '41003194160'
      BUILT_SHA: '34f9de505d0600f151d326a70bbbad77c6afccd7'
      ARTIFACT: Hiltronix-Android-arm64-SIGNED-115
      RELEASE_TAG: android-v0.24.0-hiltronix-rev-2026-10-29-1
      EXPECTED_APK_SHA256: '113191b4686eefbdd98f5a9e1771da36973497038e4737df25cbcf72cfde4902'
      EXPECTED_CERT_SHA256: 'cf3d93c795fb09dc63d8d66fcfb568f833024d4826be71f70b1b1b5dcd6284e3'
    steps:
      - name: Check out customized source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download the exact previously signed APK artifact
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BUILT_SHA" HEAD
          mkdir -p "$RUNNER_TEMP/signed-artifact" "$RUNNER_TEMP/release-assets"
          gh run download "$BUILD_RUN" --repo "$REPO" --name "$ARTIFACT" \
            --dir "$RUNNER_TEMP/signed-artifact"

      - name: Verify signed binary and security metadata before publishing
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/signed-artifact"
          apk="$dir/OneKeePass-Hiltronix-Android-arm64-RELEASE.apk"
          test -s "$apk"

          # The digest is independently computed from the verified signed build.
          actual="$(sha256sum "$apk" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_APK_SHA256"
          manifest_digest="$(awk '{print $1}' "$dir/RELEASE-SHA256SUMS.txt")"
          test "$manifest_digest" = "$EXPECTED_APK_SHA256"

          grep -F "name='com.onekeepassmobile.hiltronix' versionCode='1000115' versionName='0.24.0-hiltronix'" "$dir/RELEASE-BADGING.txt"
          grep -F "Verified using v2 scheme (APK Signature Scheme v2): true" "$dir/RELEASE-SIGNATURE.txt"
          grep -F "Verified using v3 scheme (APK Signature Scheme v3): true" "$dir/RELEASE-SIGNATURE.txt"
          grep -F "Signer #1 certificate SHA-256 digest: $EXPECTED_CERT_SHA256" "$dir/RELEASE-SIGNATURE.txt"
          grep -F "Source commit: $BUILT_SHA" "$dir/RELEASE-BUILD-INFO.txt"
          for forbidden in INTERNET ACCESS_NETWORK_STATE CAMERA; do
            if grep -q "android.permission.$forbidden" "$dir/RELEASE-PERMISSIONS.txt"; then
              echo "::error::Unexpected permission $forbidden in signed release"
              exit 1
            fi
          done

          out="$RUNNER_TEMP/release-assets"
          versioned="OneKeePass-Hiltronix-Android-0.24.0-Rev-2026-10-29-1-arm64.apk"
          cp "$apk" "$out/$versioned"
          (cd "$out" && sha256sum "$versioned" > SHA256SUMS.txt)
          cp "$dir/RELEASE-BUILD-INFO.txt" "$out/BUILD-INFO.txt"
          cp "$dir/RELEASE-SIGNATURE.txt" "$out/APK-SIGNATURE.txt"
          echo "PASS: exact tested 0.24.0 Hiltronix rev 2026-10-29-1 APK verified"

      - name: Publish GitHub Release with signed APK and checksums
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "::error::Refusing to replace an existing release"
            exit 1
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          ## Hiltronix OneKeePass Android 0.24.0 — Revision 2026-10-29-1

          This is an **unofficial, customized and security-focused fork** of
          [OneKeePass Mobile](https://github.com/OneKeePass/mobile), locked to
          upstream 0.24.0. It is **not** an original OneKeePass project release.

          ### Key modifications
          - Independent package ID `com.onekeepassmobile.hiltronix`; APK signed
            with the Hiltronix permanent certificate, independently of Google Play.
          - No Internet, network-state or camera permissions; removed built-in
            SFTP/WebDAV, remote-change UI, URL icon fetching and QR scanner.
            External `otpauth://totp` import is retained.
          - KDBX encrypted recovery snapshots, write-length and fsync checks,
            safer Android document-provider writes, read-only safeguards and
            interrupted-write recovery handling.
          - Restricted Autofill and passkey entry points; more defensive
            biometric/error state handling and reduced sensitive logging.
          - Targeted cryptography, XML, and JavaScript dependency updates.
            Corrected native C++ linkage and a stale external-change UI handler.
          - About screen identifies **Hiltronix Revision: 2026-10-29-1**.

          ### Signing and testing
          - Source commit: `34f9de505d0600f151d326a70bbbad77c6afccd7`.
          - Signed APK: [GitHub Actions build #115](https://github.com/Hiltronix/OneKeePass-mobile/actions/runs/41003194160).
          - Package `com.onekeepassmobile.hiltronix`, version code `1000115`,
            signed with APK signature schemes v2 and v3.
          - Device-tested startup, KDBX opening and About revision display.
            Full interrupted-save, Autofill, passkey and biometric acceptance
            testing has not yet been completed. Some dependency advisories
            remain documented; avoid using important data before independent
            backups and acceptance testing.

          Preserve the same signing certificate for future updates. Android
          will not update this app using a different certificate.

          See the [custom Android README](https://github.com/Hiltronix/OneKeePass-mobile)
          for changes, scope, test limitations and credit to upstream developers.
          EOF

          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/release-assets/OneKeePass-Hiltronix-Android-0.24.0-Rev-2026-10-29-1-arm64.apk" \
            "$RUNNER_TEMP/release-assets/SHA256SUMS.txt" \
            "$RUNNER_TEMP/release-assets/BUILD-INFO.txt" \
            "$RUNNER_TEMP/release-assets/APK-SIGNATURE.txt" \
            --repo "$REPO" \
            --target "$BUILT_SHA" \
            --title 'OneKeePass Android 0.24.0 — Hiltronix Revision 2026-10-29-1' \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --latest
          gh release view "$RELEASE_TAG" --repo "$REPO" --json url,tagName,assets
